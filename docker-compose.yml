services:
  otus-postgres1:
    image: postgres:18.1
    container_name: otus-postgres18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    restart: no

  otus-postgres2:
    image: postgres:18.1
    container_name: otus-postgres18-dappermultiselect
    environment:
      POSTGRES_DB: ${POSTGRES_DB_2}
      POSTGRES_USER: ${POSTGRES_USER_2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_2}
    ports:
      - "5433:5432"
    restart: no
